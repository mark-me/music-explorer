{% if artist.qty_side_projects > 0 %}
  <div class="accordion-item">
    <h2 class="accordion-header" id="headingSideProjects"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSideProjects" aria-expanded="false" aria-controls="collapseSideProjects"><b>Side projects</b></button></h2>
    <div id="collapseSideProjects" class="accordion-collapse collapse" aria-labelledby="headingSideProjects" data-bs-parent="#accordionArtist">
      <div class="accordion-body">
        <div class="row">
          {% for side_project in artist.side_projects %}
            <div class="col-md-4 d-flex justify-content-center">
              <div class="card-group">{{ card_macro.card_artist(artist=side_project) }}</div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endif %}
