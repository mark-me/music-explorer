{% if artist.qty_group_members > 0 %}
  <div class="accordion-item">
    <h2 class="accordion-header" id="headingMembers"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMembers" aria-expanded="false" aria-controls="collapseMembers"><b>Group members</b></button></h2>
    <div id="collapseMembers" class="accordion-collapse collapse" aria-labelledby="headingMembers" data-bs-parent="#accordionArtist">
      <div class="accordion-body">
        <div class="row">
          {% for member in artist.group_members %}
            <div class="col-md-4 d-flex justify-content-center">
              <div class="card-group">{{ card_macro.card_artist(artist=member) }}</div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endif %}
