<div class="accordion-item">
  <h2 class="accordion-header" id="headingCollectionItems"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCollectionItems" aria-expanded="false" aria-controls="collapseCollectionItems"><b>Collection items</b></button></h2>
  <div id="collapseCollectionItems" class="accordion-collapse collapse" aria-labelledby="headingCollectionItems" data-bs-parent="#accordionArtist">
    <div class="accordion-body">
      <div class="row">
        {% for item in all_items %}
          <div class="col-12 col-md-6 col-lg-4 d-flex justify-content-center mb-4">
            <div class="card w-100">
              <div class="card-header">
                <b>{{ item.title }}</b>
              </div>
              <div class="card-body text-center">
                <div class="position-relative d-inline-block">
                  <a href="/collection_item/{{ item.id_release }}"><img src="{{ item.url_cover }}" class="rounded" height="200" /></a>
                  <span class="position-absolute bottom-0 end-0 badge rounded-pill text-bg-dark">
                    {% for format in item.formats %}
                      {{ format.name_format }}
                    {% endfor %}
                  </span>
                </div>
                <div class="accordion mt-2" id="accordionTracks{{ loop.index }}">
                  <div class="accordion-item">
                    <h2 class="accordion-header" id="headingTracks{{ loop.index }}"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTracks{{ loop.index }}" aria-expanded="false" aria-controls="collapseTracks{{ loop.index }}"><b>Tracks</b></button></h2>
                    <div id="collapseTracks{{ loop.index }}" class="accordion-collapse collapse" aria-labelledby="headingTracks{{ loop.index }}" data-bs-parent="#accordionTracks{{ loop.index }}">
                      <div class="accordion-body">
                        <table class="table table-striped table-hover px-0">
                          {% for track in item.tracks %}
                            <tr>
                              <td>{{ track.position }}</td>
                              <td>{{ track.title }}</td>
                            </tr>
                          {% endfor %}
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
