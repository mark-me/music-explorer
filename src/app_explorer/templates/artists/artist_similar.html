<div class="accordion-item">
  <h2 class="accordion-header" id="headingSimilar"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSimilar" aria-expanded="false" aria-controls="collapseSimilar"><b>Similar artists</b></button></h2>
  <div id="collapseSimilar" class="accordion-collapse collapse" aria-labelledby="headingSimilar" data-bs-parent="#accordionArtist">
    <div class="accordion-body">
      <div class="row">
        {% for similar in artist.artists_similar %}
          <div class="col-md-4 d-flex justify-content-center">
            <div class="card-group">{{ card_macro.card_artist(artist=similar) }}</div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
