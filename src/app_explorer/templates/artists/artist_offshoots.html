{% if artist.qty_offshoots > 0 %}
  <div class="accordion-item">
    <h2 class="accordion-header" id="headingSideProjects"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSideProjects" aria-expanded="false" aria-controls="collapseSideProjects"><b>Offshoots</b></button></h2>
    <div id="collapseSideProjects" class="accordion-collapse collapse" aria-labelledby="headingSideProjects" data-bs-parent="#accordionArtist">
      <div class="accordion-body">
        <div class="row">
          {% for offshoot in artist.offshoots %}
            <div class="col-md-4 d-flex justify-content-center">
              <div class="card-group">{{ card_macro.card_artist(artist=offshoot) }}</div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endif %}
